name: Windows desktop and MP4 smoke
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  bat-test:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exercise BAT updater in isolated Git fixture
        shell: powershell
        run: .\scripts\test-windows-bats.ps1
  windows-smoke:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install project dependencies
        run: npm install --no-audit --no-fund
      - name: Type-check, unit tests and frontend bundle
        run: |
          npm run check
          npm test
          npm run build
      - name: Check Windows launcher supervisor syntax
        shell: powershell
        run: |
          $tokens=$null
          $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/scripts/ensure-service.ps1",[ref]$tokens,[ref]$errors) | Out-Null
          if($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_.Message }; exit 1 }
      - name: Local service API contract smoke
        run: npm run smoke:service
      - name: AI production JSON with real Windows narration and regeneration
        run: npm run smoke:ai-production
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Check native Tauri application
        run: cargo check --manifest-path src-tauri/Cargo.toml
      - name: Render short real MP4
        run: npm run smoke:render
      - name: Render 30-second pilot with Windows narration and captions
        run: npm run smoke:pilot
      - name: Render 12-second vector animation studio across six preset families
        run: npm run smoke:motion
      - name: Inspect rendered frames from v0.16 articulated and economic scenes
        run: npm run smoke:advanced
